"Образование",title:"Образование",parts:[{type:"text",text:"Образовательная деятельность ООО «Кейс Групп» осуществляется на основании лицензии № Л035-01218-23/01865226 на осуществление образовательной деятельности, выданной Министерством образования и науки Краснодарского края."},{type:"text",text:"ООО «Кейс Групп» реализует образовательные услуги по дополнительному профессиональному образованию (повышение квалификации)."},{type:"fields",rows:[{label:"Форма обучения",value:"Заочная (дистанционная)"},{label:"Учебный процесс",value:"Ведётся в течение всего календарного года"},{label:"Язык освоения программ",value:"Русский"}]},{type:"subhead",text:"Электронное обучение и дистанционные образовательные технологии"},{type:"list",items:["Вебинары (онлайн).","Дистанционное сопровождение обучающихся кураторами.","Использование онлайн-платформы.","Использование прикладного программного обеспечения в рамках образовательного процесса."]},{type:"text",text:"Документы, разработанные для обеспечения образовательного процесса, размещаются на сайте по мере утверждения. Дополнительные методические и иные документы для обеспечения образовательного процесса не утверждались."}]},{id:"standards",nav:"Образовательные стандарты",title:"Образовательные стандарты и требования",parts:[{type:"fields",rows:[{label:"Федеральные государственные образовательные стандарты",value:"Не применяются"},{label:"Федеральные государственные требования",value:"Не применяются"}]}]},{id:"managers",nav:"Руководство",title:"Руководство",parts:[{type:"subhead",text:"Руководитель образовательной организации"},{type:"fields",rows:[{label:"Должность",value:"Генеральный директор ООО «Кейс Групп»"},{label:"ФИО",value:"Куликова Екатерина Георгиевна"}]},{type:"subhead",text:"Заместители руководителя образовательной организации"},{type:"text",text:"Заместители руководителя образовательной организации не предусмотрены."}]},{id:"objects",nav:"Материально-техническое обеспечение",title:"Материально-техническое обеспечение и оснащённость образовательного процесса",parts:[{type:"text",text:"Образовательная деятельность осуществляется дистанционно. Для проведения занятий используется оборудованное рабочее место преподавателя с ноутбуком и доступом к сети «Интернет»."}]},{id:"grants",nav:"Стипендии и меры поддержки",title:"Стипендии и меры поддержки обучающихся",parts:[{type:"list",items:["В ООО «Кейс Групп» стипендии и иные виды материальной поддержки обучающихся не предусмотрены.","Организация не располагает общежитием и интернатом для обучающихся."]}]},{id:"vacant",nav:"Вакантные места",title:"Вакантные места для приёма (перевода) обучающихся",parts:[{type:"subhead",text:"Места, финансируемые за счёт бюджетных ассигнований федерального бюджета, бюджетов субъектов Российской Федерации, местных бюджетов"},{type:"list",items:["Образовательная деятельность, финансовое обеспечение которой осуществляется за счёт бюджетных ассигнований федерального бюджета, не осуществляется, в связи с чем вакантные места для приёма (перевода) за счёт бюджетных ассигнований федерального бюджета в организации отсутствуют.","Образовательная деятельность, финансовое обеспечение которой осуществляется за счёт бюджетных ассигнований бюджетов субъектов Российской Федерации, не осуществляется, в связи с чем вакантные места для приёма (перевода) за счёт бюджетных ассигнований бюджетов субъектов Российской Федерации в организации отсутствуют.","Образовательная деятельность, финансовое обеспечение которой осуществляется за счёт бюджетных ассигнований местных бюджетов, не осуществляется, в связи с чем вакантные места для приёма (перевода) за счёт бюджетных ассигнований местных бюджетов в организации отсутствуют."]}]},{id:"catering",nav:"Организация питания",title:"Организация питания в образовательной организации",parts:[{type:"text",text:"Образовательные программы реализуются с применением электронного обучения, дистанционных образовательных технологий в электронной информационно-образовательной среде, в том числе для инвалидов и лиц с ограниченными возможностями здоровья."},{type:"text",text:"Обеспечение условий питания обучающихся не предусмотрено."}]},{id:"budget",nav:"Финансово-хозяйственная деятельность",title:"Финансово-хозяйственная деятельность",parts:[{type:"subhead",text:"Объём образовательной деятельности по источникам финансового обеспечения"},{type:"fields",rows:[{label:"За счёт бюджетных ассигнований федерального бюджета",value:"Не осуществляется"},{label:"За счёт бюджетов субъектов Российской Федерации",value:"Не осуществляется"},{label:"За счёт местных бюджетов",value:"Не осуществляется"},{label:"По договорам об оказании платных образовательных услуг за счёт средств физических (юридических) лиц",value:"До 300 тыс. руб. за 2025 год"}]}]},{id:"inter",nav:"Международное сотрудничество",title:"Международное сотрудничество",parts:[{type:"text",text:"ООО «Кейс Групп» не имеет:"},{type:"list",items:["заключённых и планируемых к заключению договоров с иностранными и (или) международными организациями по вопросам образования и науки;","образовательных программ, имеющих международную аккредитацию."]}]},{id:"contract",nav:"Образец договора",title:"Образец договора об оказании образовательной услуги",parts:[{type:"docs",status:ep.contractStatus,items:[{title:"Образец договора возмездного оказания услуг с техническим заданием",file:"data:application/pdf;base64,JVBERi0xLjQKJSBjcmVhdGVkIGJ5IFBpbGxvdyBQREYgZHJpdmVyCjE5IDAgb2JqPDwKL1R5cGUgL0NhdGFsb2cKL1BhZ2VzIDIwIDAgUgo+PmVuZG9iagoyMCAwIG9iajw8Ci9UeXBlIC9QYWdlcwovQ291bnQgNgovS2lkcyBbIDIgMCBSIDUgMCBSIDggMCBSIDExIDAgUiAxNCAwIFIgMTcgMCBSIF0KPj5lbmRvYmoKMSAwIG9iajw8Ci9UeXBlIC9YT2JqZWN0Ci9TdWJ0eXBlIC9JbWFnZQovV2lkdGggMTI0MAovSGVpZ2h0IDE3NTQKL0ZpbHRlciBbIC9DQ0lUVEZheERlY29kZSBdCi9EZWNvZGVQYXJtcyBbIDw8Ci9LIC0xCi9CbGFja0lzMSB0cnVlCi9Db2x1bW5zIDEyNDAKL1Jvd3MgMTc1NAo+PiBdCi9CaXRzUGVyQ29tcG9uZW50IDEKL0NvbG9yU3BhY2UgL0RldmljZUdyYXkKL0xlbmd0aCAzODU2Mgo+PnN0cmVhbQomoHcC///////////////////////////////////////////////////////////////////8gSw33n/+
