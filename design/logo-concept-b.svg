<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Concept B — Digital Trace. Без рамки: асимметричная угловая траектория
       из 4 узлов разного веса — уникальная «цифровая сигнатура», не сеть и не молекула. -->
  <g id="TraceLine">
    <path d="M7 23L12.5 12" stroke="#246BFD" stroke-width="1.2" stroke-linecap="round" opacity="0.45"/>
    <path d="M12.5 12L18.5 17.5" stroke="#246BFD" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M18.5 17.5L25 8.5" stroke="#246BFD" stroke-width="1.8" stroke-linecap="round"/>
  </g>
  <g id="Node01">
    <circle cx="7" cy="23" r="1.3" fill="#246BFD" opacity="0.5"/>
  </g>
  <g id="Node02">
    <circle cx="12.5" cy="12" r="2.6" fill="#246BFD"/>
  </g>
  <g id="Node03">
    <circle cx="18.5" cy="17.5" r="1.9" fill="#246BFD"/>
  </g>
  <g id="Node04">
    <circle cx="25" cy="8.5" r="3.6" fill="#00C2FF" opacity="0.16"/>
    <circle cx="25" cy="8.5" r="1.7" fill="#00C2FF"/>
  </g>
</svg>
